# VELFORT Phase 0.5/0.6 — Linux CI + Windows CI validation of spikes/ (NOT a production build).
# Runs on GitHub-hosted windows-latest (Windows Server, not Windows 11). Results are reported as
# "Windows CI" and never as "physical Windows 11". No secrets are used; read-only token.
name: phase05-windows-spikes

on:
  push:
    branches: ["claude/velfort-password-manager-c23d9y"]
    paths: ["spikes/**", ".github/workflows/phase05-windows.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUST_TOOLCHAIN: "1.97.0"

jobs:
  linux-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: spikes
    steps:
      - uses: actions/checkout@v4
      - name: Environment and toolchain
        run: |
          uname -a; nproc; free -m | head -2
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc -V; python3 -V
      - name: Tests (platform-independent spikes)
        run: cargo test --release --locked -p vault-crypto-proto -p aead-stream-audit -p argon2-memory -p win-clipboard
      - name: "F-1 Argon2 residue meter (Linux)"
        run: |
          cargo build --release --locked -p argon2-memory
          for cfg in "65536 3 4" "64 3 1"; do
            ./target/release/argon2-memory reference "$RUNNER_TEMP/fp.bin" $cfg
            for v in positive-control-leak lib-default own-nozero own-zeroizing own-zeroizing-scrub thread-zeroizing-scrub; do
              ./target/release/argon2-memory probe $v "$RUNNER_TEMP/fp.bin" $cfg
            done
          done
      - name: Tauri configuration guard (+ self-test)
        run: |
          python3 tauri-shell/ci/check_config.py tauri-shell/src-tauri
          python3 tauri-shell/ci/check_config.py --selftest tauri-shell/src-tauri

  spikes-core:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: spikes
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          "OS: $($os.Caption) version=$($os.Version) build=$($os.BuildNumber)"
          Get-CimInstance Win32_Processor | ForEach-Object { "CPU: $($_.Name) cores=$($_.NumberOfCores) logical=$($_.NumberOfLogicalProcessors)" }
          "RAM GiB: {0:N1}" -f ((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory/1GB)
          $k='HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          if (Test-Path $k) { "WebView2 Runtime pv: $((Get-ItemProperty $k).pv)" } else { "WebView2 Runtime: registry key not found" }
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
          rustup default $env:RUST_TOOLCHAIN
          rustc -V; cargo -V

      - name: Build spikes (release)
        run: cargo build --release --locked --workspace

      - name: Tests (all spike unit/integration tests)
        run: cargo test --release --locked -p vault-crypto-proto -p aead-stream-audit -p argon2-memory -p win-clipboard

      - name: "W1 Argon2id benchmark (sequential lanes, default features)"
        continue-on-error: true
        run: |
          cargo build --release --locked -p argon2-bench
          foreach ($i in 0..6) { $o = .\target\release\argon2-bench.exe 5 $i; if ($i -eq 0) { $o } else { $o[-1] } }
          "under 4 busy threads:"
          foreach ($i in 0,2) { .\target\release\argon2-bench.exe 5 $i 4 | Select-Object -Last 1 }
          "own-buffer (zeroized) path:"
          .\target\release\argon2-bench.exe 5 2 0 own-buffer | Select-Object -Last 1

      - name: "W1 Argon2id benchmark (parallel feature / rayon)"
        continue-on-error: true
        run: |
          cargo build --release --locked -p argon2-bench --features parallel
          foreach ($i in 0..6) { $o = .\target\release\argon2-bench.exe 5 $i; if ($i -eq 0) { $o } else { $o[-1] } }
          "under 4 busy threads:"
          foreach ($i in 0,2) { .\target\release\argon2-bench.exe 5 $i 4 | Select-Object -Last 1 }

      - name: "W2 VirtualLock / CryptProtectMemory"
        continue-on-error: true
        run: .\target\release\win-memory.exe

      - name: "F-1 Argon2 residue meter (Windows)"
        continue-on-error: true
        run: |
          foreach ($cfg in @(@(65536,3,4), @(64,3,1))) {
            .\target\release\argon2-memory.exe reference "$env:RUNNER_TEMP\fp.bin" $cfg[0] $cfg[1] $cfg[2]
            foreach ($v in 'positive-control-leak','lib-default','own-nozero','own-zeroizing','own-zeroizing-scrub','thread-zeroizing-scrub') {
              .\target\release\argon2-memory.exe probe $v "$env:RUNNER_TEMP\fp.bin" $cfg[0] $cfg[1] $cfg[2]
            }
          }

      - name: "W3 Clipboard v2 secret writer (Phase 0.6)"
        continue-on-error: true
        run: .\target\release\win-clipboard.exe run

      - name: "W3 Clipboard legacy arboard run (Phase 0.5, history enabled via HKCU)"
        continue-on-error: true
        run: |
          New-Item -Path 'HKCU:\Software\Microsoft\Clipboard' -Force | Out-Null
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Clipboard' -Name EnableClipboardHistory -Value 1 -Type DWord
          .\target\release\win-clipboard.exe legacy-arboard

      - name: "W9 Native password prompt prototype"
        continue-on-error: true
        run: .\target\release\win-native-prompt.exe run

      - name: "Small NTFS volume for disk-full tests (diskpart VHDX)"
        continue-on-error: true
        run: |
          $vhd = Join-Path $env:RUNNER_TEMP 'small.vhdx'
          @"
          create vdisk file="$vhd" maximum=16 type=expandable
          select vdisk file="$vhd"
          attach vdisk
          create partition primary
          format fs=ntfs quick label=SMALL
          assign letter=V
          "@ | Out-File -Encoding ascii dp.txt
          diskpart /s dp.txt
          Get-PSDrive V | Format-List Name,Used,Free

      - name: "W8 SQLite crash recovery (journal_mode=DELETE)"
        continue-on-error: true
        run: |
          .\target\release\sqlite-crash.exe run "$env:RUNNER_TEMP\sqlite-work" "V:\"

      - name: "W10/W13 Backup prototype: size/memory, crash, disk full"
        continue-on-error: true
        run: |
          $B = ".\target\release\backup-bench.exe"
          foreach ($m in 1,16,64,256) {
            $d = Join-Path $env:RUNNER_TEMP "bb$m"; New-Item -ItemType Directory -Force $d | Out-Null
            & $B make $d $m; & $B backup $d; & $B verify $d
          }
          $d = Join-Path $env:RUNNER_TEMP "bbcrash"; New-Item -ItemType Directory -Force $d | Out-Null
          & $B make $d 4 | Out-Null; & $B backup $d | Out-Null
          $before = (Get-FileHash "$d\bench.velfort").Hash + (Get-FileHash "$d\bench.velfort-backup").Hash
          & $B crash-restore $d; "crash-restore exit code: $LASTEXITCODE"
          Get-ChildItem $d | Format-Table Name,Length
          $after = (Get-FileHash "$d\bench.velfort").Hash + (Get-FileHash "$d\bench.velfort-backup").Hash
          "source+backup unchanged: $($before -eq $after)"
          $d = Join-Path $env:RUNNER_TEMP "bbfull"; New-Item -ItemType Directory -Force $d | Out-Null
          & $B make $d 32 | Out-Null; & $B backup $d | Out-Null
          & $B restore-into $d "V:\restored.velfort"
          Get-ChildItem V:\ -Force | Format-Table Name,Length

      - name: "W12 Default ACLs of candidate data locations"
        continue-on-error: true
        run: |
          $docs = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'VELFORT-spike'
          New-Item -ItemType Directory -Force $docs | Out-Null
          Set-Content -Path (Join-Path $docs 'x.velfort') -Value 'x'
          "== Documents\VELFORT-spike\x.velfort"; icacls (Join-Path $docs 'x.velfort')
          $ad = Join-Path $env:APPDATA 'VELFORT-spike'; New-Item -ItemType Directory -Force $ad | Out-Null
          "== %APPDATA%\VELFORT-spike"; icacls $ad
          $la = Join-Path $env:LOCALAPPDATA 'VELFORT-spike'; New-Item -ItemType Directory -Force $la | Out-Null
          "== %LOCALAPPDATA%\VELFORT-spike"; icacls $la
          "== %TEMP%"; icacls $env:TEMP
          "== C:\Program Files"; icacls "C:\Program Files"

      - name: Environment summary (repeated at end of log)
        if: always()
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          "OS: $($os.Caption) version=$($os.Version) build=$($os.BuildNumber)"
          Get-CimInstance Win32_Processor | ForEach-Object { "CPU: $($_.Name) cores=$($_.NumberOfCores) logical=$($_.NumberOfLogicalProcessors)" }
          "RAM GiB: {0:N1}" -f ((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory/1GB)
          $k='HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          if (Test-Path $k) { "WebView2 Runtime pv: $((Get-ItemProperty $k).pv)" } else { "WebView2 Runtime: registry key not found" }
          rustc -V

  tauri-shell:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
          rustup default $env:RUST_TOOLCHAIN
          rustc -V; node -v; npm -v
          $k='HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          if (Test-Path $k) { "WebView2 Runtime pv: $((Get-ItemProperty $k).pv)" } else { "WebView2 Runtime: registry key not found" }

      - name: Tauri configuration guard (+ self-test)
        working-directory: spikes/tauri-shell
        run: |
          python ci/check_config.py src-tauri
          python ci/check_config.py --selftest src-tauri

      - name: Build scan-dir helper
        working-directory: spikes
        run: cargo build --release --locked -p win-memory --bin scan-dir

      - name: "W6/W7 Build spike app + NSIS installer (perMachine, downloadBootstrapper)"
        continue-on-error: true
        working-directory: spikes/tauri-shell
        run: |
          npx --yes @tauri-apps/cli@2.12.6 build
          Get-ChildItem -Recurse src-tauri\target\release\bundle | Where-Object { -not $_.PSIsContainer } | Format-Table FullName,Length

      - name: "W5/W6 Run spike app (automated JS scenario)"
        continue-on-error: true
        working-directory: spikes/tauri-shell
        run: |
          $env:VELFORT_SPIKE_REPORT = Join-Path $env:RUNNER_TEMP 'spike-report.json'
          $p = Start-Process -FilePath src-tauri\target\release\velfort-spike-shell.exe -PassThru
          if (-not $p.WaitForExit(120000)) { "TIMEOUT: app did not finish"; Stop-Process -Id $p.Id -Force }
          "exit code: $($p.ExitCode)"
          Start-Sleep -Seconds 5
          if (Test-Path $env:VELFORT_SPIKE_REPORT) { Get-Content $env:VELFORT_SPIKE_REPORT } else { "NO REPORT WRITTEN" }

      - name: "W5 Scan WebView2 user data folder for canaries"
        continue-on-error: true
        run: |
          $r = Get-Content (Join-Path $env:RUNNER_TEMP 'spike-report.json') | ConvertFrom-Json
          $udf = $r.app_local_data_dir
          "app_local_data_dir: $udf"
          Get-ChildItem -Recurse $udf -Directory -ErrorAction SilentlyContinue | Select-Object -First 40 | ForEach-Object { $_.FullName }
          .\spikes\target\release\scan-dir.exe $udf $r.canary_master $r.canary_item
          "== Chromium credential/form stores present in UDF (names only):"
          Get-ChildItem -Recurse $udf -File -Include 'Login Data*','Web Data*','*Autofill*' -ErrorAction SilentlyContinue | Format-Table FullName,Length
          "== Crashpad / failure report folder contents:"
          Get-ChildItem -Recurse (Join-Path $udf 'EBWebView\Crashpad') -File -ErrorAction SilentlyContinue | Format-Table FullName,Length,LastWriteTime
          "== ACL of app_local_data_dir"; icacls $udf

      - name: "W7 Install (perMachine) / ACL / run / uninstall / data retention"
        continue-on-error: true
        working-directory: spikes/tauri-shell
        run: |
          $setup = Get-ChildItem src-tauri\target\release\bundle\nsis\*-setup.exe | Select-Object -First 1
          "installer: $($setup.Name) size=$($setup.Length)"
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $dir = 'C:\Program Files\VELFORT Spike'
          "installed in Program Files: $(Test-Path $dir)"
          if (Test-Path $dir) { Get-ChildItem $dir | Format-Table Name,Length; icacls $dir; icacls (Join-Path $dir 'velfort-spike-shell.exe') }
          $udf = Join-Path $env:LOCALAPPDATA 'app.velfort.spike'
          "user data dir exists before uninstall: $(Test-Path $udf)"
          $un = Join-Path $dir 'uninstall.exe'
          if (Test-Path $un) { Start-Process $un -ArgumentList '/S' -Wait; Start-Sleep -Seconds 10 }
          "install dir exists after uninstall: $(Test-Path $dir)"
          "user data dir exists after uninstall: $(Test-Path $udf)"

      - name: "W7 Variant: currentUser install mode"
        continue-on-error: true
        working-directory: spikes/tauri-shell
        run: |
          npx --yes @tauri-apps/cli@2.12.6 build --config ci/currentuser.json
          $setup = Get-ChildItem src-tauri\target\release\bundle\nsis\*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'VELFORT Spike'
          "currentUser installed in %LOCALAPPDATA%\VELFORT Spike: $(Test-Path $dir)"
          if (Test-Path $dir) { icacls $dir; $un = Join-Path $dir 'uninstall.exe'; if (Test-Path $un) { Start-Process $un -ArgumentList '/S' -Wait } }

      - name: "W7 Variant: offlineInstaller WebView2 mode (size only)"
        continue-on-error: true
        working-directory: spikes/tauri-shell
        run: |
          npx --yes @tauri-apps/cli@2.12.6 build --config ci/offline.json
          Get-ChildItem src-tauri\target\release\bundle\nsis\*-setup.exe | Format-Table Name,Length
