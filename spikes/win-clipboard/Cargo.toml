[package]
name = "win-clipboard"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sha2 = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(windows)'.dependencies]
arboard = { version = "=3.7.0", default-features = false }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "=0.62.2", features = ["ApplicationModel_DataTransfer", "Foundation", "Foundation_Collections", "Win32_System_WinRT"] }
