[package]
name = "velfort-spike-shell"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "VELFORT Phase 0.5 spike: Tauri 2 security/WebView2/installer checks. NOT the application."

# Own workspace: needs WebView2 (Windows) / webkit2gtk (Linux); built only in Windows CI.
[workspace]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = ["isolation"] }

[dependencies]
tauri = { version = "=2.12.7", features = ["isolation"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "=1.9.2"

[target.'cfg(windows)'.dependencies]
win-memory = { path = "../../win-memory" }

[profile.release]
panic = "abort"
