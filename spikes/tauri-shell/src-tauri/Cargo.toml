[package]
name = "velfort-spike-shell"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "VELFORT Phase 0.5 spike: Tauri 2 security/WebView2/installer checks. NOT the application."

# Own workspace: needs WebView2 (Windows) / webkit2gtk (Linux); built only in Windows CI.
[workspace]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = ["isolation"] }

[dependencies]
tauri = { version = "=2.12.7", features = ["isolation"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "=1.9.2"

[target.'cfg(windows)'.dependencies]
win-memory = { path = "../../win-memory" }
# Already in the dependency graph via tauri-runtime-wry/wry (same versions); used only to read
# and set WebView2 settings and to probe crash-dump behaviour in this spike.
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_System_Com"] }
windows-core = "=0.62.2"

[profile.release]
panic = "abort"
