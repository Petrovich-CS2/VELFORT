[package]
name = "argon2-bench"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
argon2 = { workspace = true, features = ["zeroize"] }
zeroize = { workspace = true }
getrandom = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Foundation", "Win32_System_SystemInformation"] }

[features]
# Measures the rayon-parallel lane computation of the argon2 crate (adds rayon). Off by default.
parallel = ["argon2/parallel"]
